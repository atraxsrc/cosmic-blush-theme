# Blush colour scheme for qt5ct / qt6ct, part of cosmic-blush-theme (MIT).
# The rice's window colour for windows, its containers for buttons and
# tooltips, its text colour, the accent as highlight with the button text
# colour on it, dim placeholders.
#
# Install: ./qt/install.sh puts this in ~/.config/qt5ct/colors/ and
# ~/.config/qt6ct/colors/. Then in qt5ct / qt6ct: Appearance -> Color scheme
# -> Blush, Palette: Custom, Apply. Qt apps need QT_QPA_PLATFORMTHEME=qt5ct
# (or qt6ct) in the environment to read it.
#
# Roles, in order: WindowText, Button, Light, Midlight, Dark, Mid, Text,
# BrightText, ButtonText, Base, Window, Shadow, Highlight, HighlightedText,
# Link, LinkVisited, AlternateBase, NoRole, ToolTipBase, ToolTipText,
# PlaceholderText
[ColorScheme]
active_colors=#35302a, #fdf7ee, #fdf7ee, #e3d2bb, #ecdcc6, #ecdcc6, #35302a, #2a2620, #35302a, #fdf7ee, #f5e6d3, #ecdcc6, #9e4f5b, #f5e6d3, #9e4f5b, #9b5625, #fdf7ee, #f5e6d3, #fdf7ee, #35302a, #756454
disabled_colors=#a89584, #fdf7ee, #fdf7ee, #e3d2bb, #ecdcc6, #ecdcc6, #a89584, #8c6a4e, #a89584, #f5e6d3, #f5e6d3, #ecdcc6, #e3d2bb, #8c6a4e, #756454, #756454, #fdf7ee, #f5e6d3, #fdf7ee, #35302a, #e3d2bb
inactive_colors=#35302a, #fdf7ee, #fdf7ee, #e3d2bb, #ecdcc6, #ecdcc6, #35302a, #2a2620, #35302a, #fdf7ee, #f5e6d3, #ecdcc6, #9e4f5b, #f5e6d3, #9e4f5b, #9b5625, #fdf7ee, #f5e6d3, #fdf7ee, #35302a, #756454
